<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>

<body>
    <h2>Student Registration Form</h2>

    <form>
        <b>Roll no :</b>
        <input type="text" placeholder="Enter Roll No" name="Roll no">
        <br />
        <br />
        <b>Student name :</b>
        <input type="text" placeholder="First Name" name="Full name">
        -
        <input type="text" placeholder="Last Name" name="Last name">
        <br />
        <br />
        <b>Father name :</b>
        <input type="text" placeholder="Enter Father Name" name="Father name">
        <br />
        <br />
        <b>Date Of birth :</b>
        <input type="text" placeholder="Day" name="Date Of birth">
        -
        <input type="text" placeholder="Month" name="Date Of birth">
        -
        <input type="text" placeholder="Year" name="Date Of birth">
        <b><i>(DD-MM-YYYY)</i></b>
        <br />
        <br />
        <b>Mobile no :</b>
        <select>
            <option>+91</option>
        </select>
        -
        <input type="number" name="Mobile no">
        <br />
        <br />
        <b>E-mail id :</b>
        <input type="email" name="E-mail">
        <br />
        <br />
        <b>Password :</b>
        <input type="password" name="password">
        <br />
        <br />
        <b>Gender :</b>
        <input type="radio" name="Gender">
        Male
        <input type="radio" name="Gender">
        Female
        <br />
        <br />
        <b>Department :</b>
        <input type="checkbox" name="Department">
        CSE
        <input type="checkbox" name="Department">
        IT
        <input type="checkbox" name="Department">
        ECE
        <input type="checkbox" name="Department">
        Civil
        <input type="checkbox" name="Department">
        Mech
        <br />
        <br />
        <b>Course :</b>
        <select>
            <option>....................Select Current Course's....................</option>
        </select>
        <br />
        <br />
        <b>Student photo :</b>
        <input type="file" name="Student photo">
        <br />
        <br />
        <b>City</b>
        <input type="text" name="City">
        <br />
        <br />
        <b>Adress :</b>
        <textarea name="Address"></textarea>
        <br />
        <br />
        <button><b>Register</b></button>
    </form>
</body>

</html>
